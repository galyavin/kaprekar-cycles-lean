      Records, as numerical evidence, the even bases with exactly one cycle. The paper
      formalized here proves that pattern in Corollary 2. Chen, Ono, Schwartz and
      Thakur's Theorem 1 describes the odd-base cycles through folded differences. The
      Lean development proves what it needs about odd cores directly.
    author_endorsement: "not-contacted"
