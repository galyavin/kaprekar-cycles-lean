    author_endorsement: "not-contacted"
  - title: "Wall deflections in four-digit Kaprekar dynamics: folded doubling and the even-base 3*2^k towers"
    authors:
      - "M. Kahramanlar"
    id: "doi:10.5281/zenodo.21472450"
    type: "paper"
    location: "Section 5 (cycles in the bases 3*2^k)"
    relationship: "background"
    note: "Earlier classification for the odd part 3."
    author_endorsement: "not-contacted"
  - title: "Base scaling in four-digit Kaprekar dynamics, and an infinite family of bases with no unique terminating cycle"
    authors:
      - "Korea Superintelligence Labs"
    id: "https://lean.up.railway.app/papers/kaprekar-v1.pdf (public draft, version 1, accessed 17 November 2026)"
    type: "paper"
    location: "Theorem 3.2, Theorem 7.1, Remark 7.2, Sections 9 and 10"
    relationship: "background"
    note: >-
      Proves the unique-cycle pattern for even bases up to 200 and reports a computational
      check up to 6200. Section 9 leaves the general conditions open.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "PALOMAR-2026-11-21-000001"
    relationship: "builds-on"
    note: >-
      PALOMAR-2026-11-21-000001 compares only Corollary 2. It identifies the even bases
      with exactly one cycle and gives that cycle's length. Theorem 1 classifies every
      nonconstant cycle in every even base. It identifies all lifts from odd cores with
      their original periods, classifies the additional cycles and their exact periods,
      and counts the cycles of each length in every power of two. This includes bases
      with more than one cycle, for example base 4 with one fixed point and a 2-cycle.
      Both entries use the same development. Theorem 1 was already proved there and
      this entry presents its first direct comparison for the digit-sorting map.
  - id: "https://github.com/galyavin/kaprekar-dynamics (cycles-even-bases/ancillary/lean)"
    relationship: "builds-on"
    note: >-
      The substantive Lean development of the paper (Theorem 1 and Corollary 2 for the
      development's step map on four-slot digit words), by the same author. SolutionTheorem1 imports a port of that development included in this repository
      and reuses the original Solution's proof relating its step map to the Challenge
      definition. The port uses Lean's module system and Lean 4.35.0-rc2.
  - id: "https://lean.up.railway.app/papers/kaprekar-v1.pdf"
    relationship: "independent"
    note: >-
      The Korea Superintelligence Labs draft reports formal cycle checks for even bases up to
      200. They are neither used nor ported here.

