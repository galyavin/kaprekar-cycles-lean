fidelity:
  divergences: >-
    The paper defines the map on integers 0 <= x < B^4. The Challenge does the same, with the
    descending arrangement given by insertion sort and Nat subtraction (which never truncates
    here). The development works instead with four-slot integer digit words and a sorting
    network. SolutionTheorem1 reuses Solution.lean's proof that the two maps are conjugate.
    Forward orbit membership of a periodic representative specifies the cycle. A return-time
    equivalence identifies each lift's least period with that of its odd-core cycle.
    Disjoint, indexed representatives give the exact counts in the powers-of-two table.
    The compared declarations split Theorem 1 into its three cases, with base two and
    higher powers compared separately.

review:
  status: "agent-reviewed"
  reviewers:
