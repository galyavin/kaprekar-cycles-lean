version: "v0.4"

project:
  name: "Cycles of the four-digit Kaprekar map in even bases"
  description: >-
    The four-digit Kaprekar map in base B sends an integer 0 <= x < B^4, written with
    four base-B digits (leading zeros allowed), to the descending arrangement of its
    digits minus the ascending arrangement. A cycle is a periodic orbit through an input
    whose digits are not all equal. Cycles are counted up to cyclic shift, including fixed
    points of least period one. This formalization uses only Lean 4 core and Std and
    proves Theorem 1 of R. Galyavin, "Cycles of the four-digit Kaprekar map in even bases"
    (2026). For B = m*2^n with m odd, n >= 1 and m >= 5, each cycle of the folded map
    on odd difference pairs lifts to a cycle of the same length. There is one additional
    cycle of length n+1 if 2^n is 1 modulo m, or one of length 2(n+1) if m = 5 and n is
    2 modulo 4. The two conditions are mutually exclusive and the list is exhaustive.
    For m = 3, odd n gives one cycle of length 3(n+1), and even n gives two cycles
    of lengths n+1 and 2(n+1). Base two has two fixed points. In base 2^n for odd n >= 3
    there are (n-1)/2 cycles of each length n and n+2. For even n >= 2 there are
    (n-2)/2 cycles of each of those lengths, one of length n/2 and one of length n/2+1.
    The map is stated directly as digit sorting and subtraction on natural numbers.
  authors:
    - "Rustem Galyavin"
  responsible_maintainers:
    - "Rustem Galyavin"
  license: "MIT"
  contact:
    name: "Rustem Galyavin"
    email: "rustem@galyavin.com"
    orcid: "0009-0006-6875-9170"

