fidelity:
  divergences: >-
    The paper defines the map on integers 0 <= x < B^4. The Challenge does the same, with the
    descending arrangement given by insertion sort and Nat subtraction (which never truncates
    here). The development works instead with four-slot integer digit words and a sorting
    network; Solution.lean proves the two maps conjugate. "Exactly one cycle" is stated as: a
    periodic input with non-constant digits whose orbit contains every periodic input with
    non-constant digits; the cycle length is that input's least period. The compared statement is quantified over
    the even base B itself. The proof transports the uniqueness and least-period fields of
    every_even_base to the sorting-and-subtraction map.

