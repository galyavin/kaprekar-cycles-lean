# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Even bases with exactly one four-digit Kaprekar cycle"
  description: >-
    The four-digit Kaprekar map in base B sends an integer 0 <= x < B^4, written with
    four base-B digits (leading zeros allowed), to the descending arrangement of its
    digits minus the ascending arrangement. A cycle is a periodic orbit through an input
    whose digits are not all equal. Cycles are counted up to cyclic shift, including fixed
    points of least period one. This formalization uses only Lean 4 core and Std and proves that an even base B >= 2 has exactly one cycle if and only if
    B = 3*2^(2k+1) or B = 5*2^(2k+1) for some k >= 0, or B = 7*2^n with n >= 1 and n not
    divisible by 3. In these three families the unique cycle has length 6(k+1), 1 and 3,
    respectively; base ten is 5*2^1, with the fixed point 6174. This is Corollary 2 of
    R. Galyavin, "Cycles of the four-digit Kaprekar map in even bases" (2026). It proves
    the pattern that Chen, Ono, Schwartz and Thakur recorded from numerical evidence
    (J. Integer Seq. 29 (2026), Remark 28). The map is stated directly as digit sorting
    and subtraction on natural numbers. The underlying Lean development also proves the
    paper's Theorem 1, the classification of all cycles in every even base m*2^n; that
    classification is not part of the statement compared here.
  authors:
    - "Rustem Galyavin"
  responsible_maintainers:
    - "Rustem Galyavin"
  license: "MIT"
  contact:
    name: "Rustem Galyavin"
    email: "rustem@galyavin.com"
    orcid: "0009-0006-6875-9170"

sources:
  - title: "Cycles of the four-digit Kaprekar map in even bases"
    authors:
      - "Rustem Galyavin"
    id: "doi:10.5281/zenodo.24358739"
    type: "paper"
    location: "Corollary 2 (the unique-cycle bases and the lengths of their cycles); Theorem 1 is proved by the development but not compared here"
    relationship: "formalizes"
    note: >-
      The formalization's author is the paper's author. The paper's ancillary material,
      including the original Lean development on Lean 4.28.0, is archived at
      doi:10.5281/zenodo.24325110 and maintained at https://github.com/galyavin/kaprekar-dynamics
      (folder cycles-even-bases/ancillary/lean).
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Four-digit Kaprekar dynamics in odd bases"
    authors:
      - "E. Chen"
      - "K. Ono"
      - "R. E. Schwartz"
      - "D. Thakur"
    id: "J. Integer Seq. 29 (2026), Article 26.4.7; arXiv:2606.20439"
    type: "paper"
    location: "Remark 28 (the unique-cycle pattern in even bases, recorded from numerical evidence); Theorem 1 (cycles in odd bases)"
    relationship: "background"
    note: >-
      Records, as numerical evidence, the even bases with exactly one cycle. The paper
      formalized here proves that pattern. Its odd-base Theorem 1 is used in the paper's
      informal proof of Corollary 2; the Lean development proves what it needs about odd
      cores directly.
    author_endorsement: "not-contacted"
  - title: "The determination of all four-digit Kaprekar constants"
    authors:
      - "H. Hasse"
      - "G. D. Prichett"
    id: "J. Reine Angew. Math. 299/300 (1978), 113-124"
    type: "paper"
    location: "Theorem 4.1 (all cycles in the bases 5*2^n)"
    relationship: "background"
    note: "Earlier classification for the odd part 5, which contains the base-ten case."
    author_endorsement: "not-contacted"
  - title: "Wall deflections in four-digit Kaprekar dynamics: folded doubling and the even-base 3*2^k towers"
    authors:
      - "M. Kahramanlar"
    id: "doi:10.5281/zenodo.21472450"
    type: "paper"
    location: "Section 5 (cycles in the bases 3*2^k)"
    relationship: "background"
    note: "Earlier classification for the odd part 3; the first family of the corollary also follows from it."
    author_endorsement: "not-contacted"
  - title: "Base scaling in four-digit Kaprekar dynamics, and an infinite family of bases with no unique terminating cycle"
    authors:
      - "Korea Superintelligence Labs"
    id: "https://lean.up.railway.app/papers/kaprekar-v1.pdf (public draft, version 1, accessed 17 November 2026)"
    type: "paper"
    location: "Theorem 3.2, Theorem 7.1, Remark 7.2, Sections 9 and 10"
    relationship: "background"
    note: >-
      Proves the unique-cycle pattern for even bases up to 200 and reports a computational
      check up to 6200; leaves the general exponent conditions open (Section 9), which the
      formalized corollary settles.
    author_endorsement: "not-contacted"

