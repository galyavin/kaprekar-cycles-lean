name: Palomar preflight for Theorem 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight002
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-theorem1.json","formalization_metadata_path":"palomar-theorem1/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
